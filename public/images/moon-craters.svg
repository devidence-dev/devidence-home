<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Craters lit from the top-left: soft bowl, shaded upper-left wall,
       bright lower-right rim. Edit the (cx, cy, r) list to move them. -->
  <defs>
    <radialGradient id="bowl" cx=".42" cy=".4" r=".62">
      <stop offset="0" stop-color="#5f6978" stop-opacity=".15"/>
      <stop offset=".65" stop-color="#8e98a8" stop-opacity=".08"/>
      <stop offset="1" stop-color="#b9c1ce" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b5565" stop-opacity=".45"/>
      <stop offset=".45" stop-color="#4b5565" stop-opacity="0"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".95"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation=".5"/></filter>
  </defs>
  <g filter="url(#soft)">
    <circle cx="66" cy="30" r="7" fill="url(#bowl)"/>
    <circle cx="66" cy="30" r="7" fill="none" stroke="url(#wall)" stroke-width="1.1"/>
    <circle cx="128" cy="34" r="6" fill="url(#bowl)"/>
    <circle cx="128" cy="34" r="6" fill="none" stroke="url(#wall)" stroke-width="1.0"/>
    <circle cx="88" cy="58" r="9" fill="url(#bowl)"/>
    <circle cx="88" cy="58" r="9" fill="none" stroke="url(#wall)" stroke-width="1.4"/>
    <circle cx="160" cy="48" r="13" fill="url(#bowl)"/>
    <circle cx="160" cy="48" r="13" fill="none" stroke="url(#wall)" stroke-width="2.1"/>
    <circle cx="28" cy="52" r="5" fill="url(#bowl)"/>
    <circle cx="28" cy="52" r="5" fill="none" stroke="url(#wall)" stroke-width="0.9"/>
    <circle cx="94" cy="148" r="6" fill="url(#bowl)"/>
    <circle cx="94" cy="148" r="6" fill="none" stroke="url(#wall)" stroke-width="1.0"/>
    <circle cx="144" cy="160" r="8" fill="url(#bowl)"/>
    <circle cx="144" cy="160" r="8" fill="none" stroke="url(#wall)" stroke-width="1.3"/>
    <circle cx="56" cy="164" r="11" fill="url(#bowl)"/>
    <circle cx="56" cy="164" r="11" fill="none" stroke="url(#wall)" stroke-width="1.8"/>
    <circle cx="176" cy="140" r="5" fill="url(#bowl)"/>
    <circle cx="176" cy="140" r="5" fill="none" stroke="url(#wall)" stroke-width="0.9"/>
    <circle cx="110" cy="16" r="3" fill="url(#bowl)"/>
    <circle cx="110" cy="16" r="3" fill="none" stroke="url(#wall)" stroke-width="0.9"/>
    <circle cx="150" cy="180" r="4" fill="url(#bowl)"/>
    <circle cx="150" cy="180" r="4" fill="none" stroke="url(#wall)" stroke-width="0.9"/>
    <circle cx="122" cy="178" r="3" fill="url(#bowl)"/>
    <circle cx="122" cy="178" r="3" fill="none" stroke="url(#wall)" stroke-width="0.9"/>
    <circle cx="20" cy="120" r="3" fill="url(#bowl)"/>
    <circle cx="20" cy="120" r="3" fill="none" stroke="url(#wall)" stroke-width="0.9"/>
  </g>
</svg>
