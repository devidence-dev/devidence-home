name: 🚀 Build and Deploy

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "How to increment the version (ignored if custom_tag is set). 'rebuild' rebuilds the current tag image without increasing the version — use it when only the base image or language version changed, not the code."
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - rebuild
      custom_tag:
        description: "Custom tag (e.g. v1.2.3). Overrides the automatic version bump when set."
        required: false
        type: string
      prerelease:
        description: "Mark as a pre-release?"
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    name: 🚀 Build, Push & Deploy
    uses: devidence-dev/workflows/.github/workflows/cd-build-deploy-semver.yml@v1
    with:
      app_name: devidence-home
      values_path: kubernetes/internal-apps/devidence-home/values.yaml
      bump: ${{ inputs.bump }}
      custom_tag: ${{ inputs.custom_tag }}
      prerelease: ${{ inputs.prerelease }}
    secrets:
      HOMELAB_DEPLOY_TOKEN: ${{ secrets.HOMELAB_DEPLOY_TOKEN }}
    permissions:
      contents: write
      id-token: write
